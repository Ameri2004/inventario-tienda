<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comprobante | TIENDA PRO-SOFT</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            width: 300px; 
            margin: 20px auto; 
            padding: 15px; 
            border: 1px solid #000; 
        }
        .text-center { text-align: center; }
        .divider { border-top: 1px dashed #000; margin: 10px 0; }
        .total { 
            font-size: 1.3em; 
            font-weight: bold; 
            margin-top: 10px; 
            border: 1px solid #000; 
            padding: 5px; 
        }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body onload="window.print()">
    <div class="text-center">
        <h3>TIENDA PRO-SOFT</h3>
        <p>Bolivia</p>
    </div>
    <div class="divider"></div>
    <p><strong>Nro:</strong> #{{ venta.id }}</p>
    <p><strong>Fecha:</strong> {{ venta.fecha.strftime('%d/%m/%Y %H:%M') }}</p>
    <p><strong>Cliente:</strong> {{ venta.cliente_nombre or 'General' }}</p>
    <div class="divider"></div>
    <p><strong>Detalle:</strong> {{ venta.producto_nombre }}</p>
    <div class="text-center total">
        TOTAL: {{ "%.2f"|format(venta.total|float) }} Bs.
    </div>
    <div class="text-center no-print">
        <button onclick="window.print()" style="margin-top:20px; padding: 10px; cursor:pointer;">Imprimir Factura</button>
    </div>
</body>
</html>
