<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso al Sistema | TIENDA PRO-SOFT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(-45deg, #4facfe, #00f2fe, #43e97b, #38f9d7);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px; border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%; max-width: 400px; text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="fw-bold mb-4">TIENDA PRO-SOFT</h3>
        <form action="/login" method="POST">
            <div class="mb-3 text-start">
                <label class="form-label fw-bold">Usuario</label>
                <input type="text" name="username" class="form-control rounded-pill px-3" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label fw-bold">Contraseña</label>
                <input type="password" name="password" class="form-control rounded-pill px-3" required>
            </div>
            <button type="submit" class="btn btn-dark w-100 rounded-pill fw-bold">INGRESAR</button>
        </form>
    </div>
</body>
</html>
